<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whitepace - SaaS landing page</title>
    <link rel="Stylesheet" href="assets/styles/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="page-padding">
      <div class="logo">
        <img src="assets/images/logoimg.png" alt="whitepace-logo" />
        <span class="logo-text">whitepace</span>
      </div>
      <div class="nav-bar">
        <div class="nav">
          <ul class="nav-menu">
            <li>Products <i class="fa-duotone fa-solid fa-angle-down"></i></li>
            <li>Solutions <i class="fa-duotone fa-solid fa-angle-down"></i></li>
            <li>
              Rescourcing <i class="fa-duotone fa-solid fa-angle-down"></i>
            </li>
            <li>Pricing <i class="fa-duotone fa-solid fa-angle-down"></i></li>
          </ul>
        </div>
        <div class="button">
          <button class="btn1">Login</button>
          <button class="btn2">
            Try Whitepace free <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>
    </header>
    <main>
      <section class="section-1 page-padding">
        <div class="section-1text">
          <h1 class="whitecolor-headings">Get More Done with Whitepace</h1>
          <p class="whitecolor-text">
            Project management software that enables your teams to collaborate,
            plan, analyse and manage everyday tasks
          </p>
          <div class="section-1btn">
            <button class="btn2">
              Try Whitepace free <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>
        <div class="section-1square"></div>
      </section>
    </main>
  </body>
</html>
